[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-control-center"
version = "0.8.0.dev0"
description = "Local-first control, health, archive, and verification tooling for Project Prometheus."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Private / project-specific"}
authors = [{name = "Project Prometheus"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
offline = ["libzim==3.13.1"]

[project.scripts]
prometheusctl = "prometheus_control_center.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
